<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main-layout}" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>PDI Admin</title>  
  <style>
  	  	
  </style>
</head>
<body>
  <section layout:fragment="content">
  	<div class="container">
  		<div class="row">
  			<div class="col-lg-12"> 
  				<h1 th:text="#{admin.title}">Actions Admin</h1>
  			</div>
  		</div>
  	
  		<ul class="nav nav-tabs" id="myTab" role="tablist">
		  <li class="nav-item" role="presentation">
		    <a class="nav-link active" id="home-tab" data-toggle="tab" href="#home" role="tab" aria-controls="home" aria-selected="true" th:text="#{admin.import}">Home</a>
		  </li>
		  <li class="nav-item" role="presentation">
		    <a class="nav-link" id="profile-tab" data-toggle="tab" href="#profile" role="tab" aria-controls="profile" aria-selected="false" th:text="#{admin.terminate}">Profile</a>
		  </li>
		  <li class="nav-item" role="presentation">
		    <a class="nav-link" id="contact-tab" data-toggle="tab" href="#contact" role="tab" aria-controls="contact" aria-selected="false" th:text="#{admin.export}">Contact</a>
		  </li>
		</ul>
		<div class="tab-content" id="myTabContent">
		  <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab" th:insert="fragments/admin-import :: import"></div>
		  <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab">...</div>
		  <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">...</div>
		</div> 
	</div> 		  	
  </section>
 </body>
 </html>
