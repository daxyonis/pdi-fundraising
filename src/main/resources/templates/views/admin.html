<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main-layout}" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>PDI Admin</title>
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/v/bs4/dt-1.10.23/fh-3.1.8/r-2.2.7/datatables.min.css"/> 
  <script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.23/fh-3.1.8/r-2.2.7/datatables.min.js"></script>    
</head>
<body>
  <section layout:fragment="content">
  	<div class="container">
  		<div class="row">
  			<div class="col-lg-12"> 
  				<h1 th:text="#{admin.title}">Actions Admin</h1>
  			</div>
  		</div>
  	
  		<ul class="nav nav-tabs" id="myTab" role="tablist">
		  <li class="nav-item" role="presentation">
		    <a class="nav-link active" id="home-tab" data-toggle="tab" href="#home" role="tab" aria-controls="home" aria-selected="true" th:text="#{admin.import}">Home</a>
		  </li>
		  <li class="nav-item" role="presentation">
		    <a class="nav-link" id="profile-tab" data-toggle="tab" href="#profile" role="tab" aria-controls="profile" aria-selected="false" th:text="#{admin.terminate}">Profile</a>
		  </li>
		  <li class="nav-item" role="presentation">
		    <a class="nav-link" id="contact-tab" data-toggle="tab" href="#contact" role="tab" aria-controls="contact" aria-selected="false" th:text="#{admin.export}">Contact</a>
		  </li>
		</ul>
		<div class="tab-content" id="myTabContent">
		  <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab" th:insert="fragments/admin-import :: import"></div>
		  <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab" th:insert="fragments/admin-terminate :: terminate"></div>
		  <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab" th:insert="fragments/admin-export :: export"></div>
		</div> 
	</div> 	
	
	<!-- /* Close Campaign Confirmation Modal */ -->
	<div th:replace="fragments/modal-terminate :: modal"></div>
	
	<!-- /* Block Campaign Confirmation Modal */ -->
	<div class="modal fade" id="blockConfirm" data-backdrop="static" data-keyboard="false" tabindex="-1" aria-labelledby="blockConfirmLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">	      	
	        <h5 class="modal-title" id="blockConfirmLabel" th:text="#{admin.block.confirm.title}">Modal title</h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body text-center">
	      		<h2><i class="fas fa-exclamation-triangle"></i></h2>
	      		<h3>ATTENTION</h3>
	      		<p th:text="#{admin.block.confirm.warning}">cette action est irreversible...</p>
	      		<h4 th:text="#{admin.block.confirm.question}">etes-vous certain de vouloir terminer ?</h4>	      			      		 
	      </div>
	      <div class="modal-footer">
	      		<button type="button" id="blockCampaignConfirmed" class="btn btn-primary" th:text="#{admin.block.yes}">oui</button>  	
	        	<button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{admin.cancel}">annuler</button>        
	      </div>
	    </div>
	  </div>
	</div>
	
	<!-- /* Export Campaign Confirmation Modal */ -->
	<div class="modal fade" id="exportConfirm" data-backdrop="static" data-keyboard="false" tabindex="-1" aria-labelledby="exportConfirmLabel" aria-hidden="true">
	  <div class="modal-dialog modal-lg">
	    <div class="modal-content">
	      <div class="modal-header">	      	
	        <h5 class="modal-title" id="exportConfirmLabel" th:text="#{admin.export.modal.title}">Modal title</h5>		               
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>	      
		      <div class="modal-body">
		      	<div class="container-fluid">
		      		<div class="row text-center">
		      			<div class="col-md-12"><h5 id="campaignInfo">1025 Ecole LMNO - Financement des activites scolaires</h5></div>
		      		</div>
	    			<div class="row mt-3">
	    				<div class="col-md-6 font-weight-bold" th:text="#{admin.export.modal.description}">exporter par CSV</div>
	    			</div>
	    			<form id="exportForm" class="needs-validation" novalidate>
	    				<div class="form-group row">
						    <label for="orderHeaderFilename" class="col-sm-4 col-form-label" th:text="#{admin.export.modal.filename.header}">fichier des entetes bc</label>
						    <div class="col-sm-8">
						      <input type="text" class="form-control" id="orderHeaderFilename" name="orderHeaderFilename" required/>
						      <div class="invalid-feedback" th:text="#{field.required}"></div>
						    </div>
						 </div>
						 <div class="form-group row">
						    <label for="orderDetailFilename" class="col-sm-4 col-form-label" th:text="#{admin.export.modal.filename.detail}">fichier des details bc</label>
						    <div class="col-sm-8">
						      <input type="text" class="form-control" id="orderDetailFilename" name="orderDetailFilename" required/>
						      <div class="invalid-feedback" th:text="#{field.required}"></div>
						    </div>
						  </div>
	    			</form>    			
	    		</div>  		 
		      </div>
		      <div class="modal-footer">	      	
		      		<button type="button" id="exportCampaignConfirmed" class="btn btn-primary" th:text="#{admin.export.modal.button}">oui</button>	      	
		        	<button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{admin.cancel}">annuler</button>	        	        
		      </div>	      
	    </div>
	  </div>
	</div>	
	  	
	<script th:inline="javascript">
		$(function(){			
			$('#blockCampaignConfirmed').on('click', blockCampaign);			
			
			$('#exportCampaignConfirmed').on('click', function(){
  				$('#exportForm').submit();
  			})
  				
  			$('#exportForm').on('submit', function(event){
  				event.preventDefault();
  		        event.stopPropagation(); 
  		        
				// Check validity
				if (this.checkValidity() === false) {
 					this.classList.add('was-validated');		  				
 		          	return false;
 		        }
  				this.classList.add('was-validated');
  				
				// Validated, go !
				let campaignId = $(this).data('id');
  				exportCampaign(campaignId);
  			});
			
		});
	</script>
  </section>
 </body>
 </html>
