<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main-layout}" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{pdi.summary}">pdi synthese</title>  
</head>
<body>
  <section class="p-lg-3" layout:fragment="content">
  	<div class="container"> 
  		<div class="row">
  			<div class="col-md-6">
  				<h2 th:text="#{summary.title}">synthese des ventes</h2>
  			</div>
  			<div class="col-md-4 text-right"><h4><span class="font-weight-bold" th:text="#{summary.totalAmount}">montant total</span></h4></div>
  			<div class="col-md-2"><h4><span class="badge badge-success p-2" th:text="${campaignRecap.formattedTotalSales}">4500.00$</span></h4></div>
  		</div>  		
  		<div class="row">
  			<div class="col-md-6 offset-md-1">
  				<a href="http://www.poivredesiles.com/contact.html" target="_blank" class="btn btn-light" th:text="#{summary.contact}">contactez-nous</a>
  			</div>
  			<div class="col-md-3 text-right"><h4><span class="font-weight-bold" th:text="#{summary.profit}">profit</span></h4></div>
  			<div class="col-md-2"><h4><span class="badge badge-info p-2" th:text="${campaignRecap.formattedTotalProfit}">2250.00$</span></h4></div>
  		</div>
  		<div class="row mt-3">
  			<div class="col-md-11 offset-md-1">  				
  				<h4><span class="font-weight-bold" th:text="#{summary.subtitle}">synthese de la campagne</span></h4>
  				<div class="row py-1">
  					<div class="col-md-3 text-right font-weight-bold" th:text="#{summary.organization}">organisme:</div>
  					<div class="col-md-9">Ecole ABC</div>
  				</div>
  				<div class="row py-1">
  					<div class="col-md-3 text-right font-weight-bold" th:text="#{summary.project}">Projet</div>
  					<div class="col-md-9">Financement voyage scolaire</div>
  				</div>
  				<div class="row py-1">
  					<div class="col-md-3 text-right font-weight-bold" th:text="#{summary.leader}">Responsable de la campagne</div>
  					<div class="col-md-9">Guy Lanctot</div>
  				</div>
  				<div class="row py-1">
  					<div class="col-md-3 text-right font-weight-bold py-1" th:text="#{summary.close}"> terminer</div>
  					<div class="col-md-9">
  						<button role="button" class="btn btn-primary" th:text="#{summary.closeCampaign}">terminer la campange</button>
  					</div>
  					
  				</div>
  				<div class="row py-1">
  					<div class="col-md-3 text-right font-weight-bold" th:text="#{summary.details}">details</div>
  					<div class="col-lg-9"></div>
  				</div>
  				<div class="row py-1">
  					<div class="col-md-3 text-right font-weight-bold" th:text="#{summary.campaignTotal}">total de la campagne</div>
  					<div class="col-lg-9"></div>
  				</div>
  			</div>
  		</div>  	  		
  	</div>  	
  </section>
 </body>
 </html>
