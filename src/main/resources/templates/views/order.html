<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main-layout}" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{pdi.order}">pdi commande</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/order.css}"/>
  <script th:src="${#arrays.contains(@environment.getActiveProfiles(), 'prod')} ?
                    'https://checkout.clover.com/sdk.js' : 'https://checkout.sandbox.dev.clover.com/sdk.js'"></script>
</head>
<body>
  <section class="p-lg-3" layout:fragment="content">
    <div id="payForm" class="container d-none">
      <div th:include="~{fragments/payment-form :: payment}"></div>
    </div>
  	<div id="orderForm" class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <h3 id="newOrderTitle" th:text="#{order.new}">nouvelle commande</h3>
                <h3 id="orderTitle" class="d-none" th:text="#{order.payment}">paiement de la commande #2845...</h3>
                <h5 id="orderTitleHelp" class="d-none" th:text="#{order.payment.help}">Veuillez entrer vos informations de facturation dans le formulaire ci-dessoous.</h5>
            </div>
        </div>
        <!--/* Messages */-->
        <div class="row">
            <div class="col-md-12">
                <div th:if="${failure}" class="alert alert-danger" th:text=#{order.error.failure}></div>
                <div class="alert alert-warning d-none" id="order-msg-error">Une erreur est survenue...</div>
            </div>
        </div>
        <form id="buyerForm" novalidate>
            <div th:replace="~{fragments/order-header :: header}"></div>
            <div th:replace="~{fragments/order-items :: items}"></div>
        </form>
  	</div>
  	<script th:inline="javascript">
  		$('#logoutForm').on('submit', function(){
  			sessionStorage.clear();
  			return true;
  		});
  	</script>
  </section>
 </body>
 </html>
