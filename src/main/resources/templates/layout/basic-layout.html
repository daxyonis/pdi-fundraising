<!DOCTYPE html>
<html class="h-100" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- /* Favicon */ -->	
	<link rel="apple-touch-icon" sizes="180x180" th:href="@{/image/apple-touch-icon.png}">
	<link rel="icon" type="image/png" sizes="32x32" th:href="@{/image/favicon-32x32.png}">
	<link rel="icon" type="image/png" sizes="16x16" th:href="@{/image/favicon-16x16.png}">
	<link rel="manifest" th:href="@{/image/site.webmanifest}">
	<link rel="mask-icon" th:href="@{/image/safari-pinned-tab.svg}" color="#5bbad5">
	<meta name="msapplication-TileColor" content="#da532c">
	<meta name="theme-color" content="#ffffff">
	
  	<title>Layout page</title>  	
  	<link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
  	<link rel="stylesheet" href="/css/theme_1613591810408.css">
  	<script src="/webjars/jquery/jquery.min.js"></script>
  	<script src="/webjars/bootstrap/js/bootstrap.min.js"></script>

	<style>
		.container {
			width: auto;
  			max-width: 680px;
  			padding: 0 15px;
		}
		.footer {
		  background-color: #f5f5f5;
		}
	</style>
</head>
<body class="d-flex flex-column h-100">
  <header class="flex-shrink-0">
  	<div class="container-fluid">
  		<div class="row">
			<div class="col-6">
				<img th:src="@{/image/LogoPDI.png}" class="img-logo mx-auto img-fluid"></img>
			</div>
  			<div class="col-6">
		  		<div class="float-right pt-3">
			  		<a th:href="@{__${#httpServletRequest.requestURI}__?lang=__#{lang.other}__}" th:text="#{lang.change}">English</a>
			  	</div>
  			</div>
  		</div>	  		  	
  	</div>
  </header>
  <section layout:fragment="content" class="flex-shrink-0">
    <p>Page content goes here</p>
  </section>
  <div th:replace="fragments/footer :: footer"></div>  
</body>
</html>
