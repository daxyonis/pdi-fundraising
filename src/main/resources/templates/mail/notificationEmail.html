<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <style>
        	.ital {
        		font-style: italic;
        	}
        	.bold {
        		font-weight: bold;
        	}
        	.blue {
        		color: blue;
        	}
        </style>
</head>
<body>
    <h2 th:text="#{email.notification}">Notification de Poivre des Iles</h2>

    <p th:text="${notification.message}">Ceci est un rappel pour vous notifier de bla bla bla. Veuillez SVP taratata...</p>

    <p class="ital" th:text="#{email.noreply}">Veuillez ne pas repondre a ce message.</p>
    <p class="ital" th:text="#{email.generated}">
        Ce courriel a ete genere automatiquement par la plateforme
    </p>
</body>
</html>
