<!DOCTYPE html >
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	</head>
	<body>		
	<th:block th:fragment="header">
		<script th:inline="javascript">
			let organizationName = /*[[${seller.pdiCampaignOrganization}]]*/'';
  			let leaderName = '';
  			let campaignId = /*[[${seller.pdiCampaignId}]]*/0;
  			let campaignNumber = /*[[${seller.pdiCampaignNumber}]]*/0;
		</script>
		<h2 th:text="#{sales.title}">Mes Ventes</h2>
		<div class="row">
			<div class="col-md-6 offset-md-1">
				<div th:replace="fragments/contact-pdi :: contact-pdi"></div>
			</div>
		</div>
		<h4 class="mt-3 font-weight-bold" th:text="#{sales.seller.info}">Informations du vendeur</h4>
		<div class="row">
			<div class="col-md-3" th:text="|#{sales.seller.name}:|">Nom:</div>
			<div class="col-md-4" th:text="${seller.name}">Pierre Laliberte</div>	
			<th:block  th:unless="${#strings.isEmpty(seller.pdiGroupName)}">				
				<div class="col-md-2 text-right" th:text="|#{sales.seller.group}:|">Groupe:</div>
				<div class="col-md-3 text-right" th:text="${seller.pdiGroupName}">Classe 502</div>
			</th:block>			
		</div>  
		<div class="row">
			<div class="col-md-3" th:text="|#{sales.seller.organization}:|">Organisme:</div>
			<div class="col-md-9" th:text="${seller.pdiCampaignOrganization}">Ecole ABC</div>
		</div>
		<div class="row">
			<div class="col-md-3" th:text="|#{sales.seller.project}:|">Projet:</div>
			<div class="col-md-9" th:text="${seller.pdiCampaignProject}">Financement du voyage scolaire</div>
		</div>
		<div class="row mt-3">
			<div class="col-md-5 col-lg-3"><h4 class="pt-3 font-weight-bold" th:text="#{sales.seller.summary}">Resume des ventes</h4></div>
			<div class="col-md-3"><h4><span class="badge badge-pill badge-success p-3" th:text="#{sales.seller.total(${seller.formattedOrdersTotal})}">150.00$ TOTAL</span></h4></div>
			<div class="col-md-3"><h4><span class="badge badge-pill badge-info p-3" th:text="#{sales.seller.orders(${seller.numOrders})}">8 commandes</span></h4></div>
		</div>		
	</th:block>
	</body>
</html>
