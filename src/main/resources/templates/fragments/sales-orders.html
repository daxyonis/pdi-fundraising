<!DOCTYPE html >
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	</head>
	<body>		
	<th:block th:fragment="orders">  
		<h4 class="mt-3 font-weight-bold" th:text="#{sales.orders.subtitle}">liste des commandes</h4>
		<th:block th:each="order : ${orders}">
			<div class="row mt-3">
				<div class="col-md-2" th:text="|#{sales.orders.buyer}:|">acheteur:</div>
				<div class="col-md-3" th:text="${order.buyerName}">ginette thibault</div>
				<div class="col-md-2" th:text="${order.buyerPhone}">438-123-9874</div>
				<div class="col-md-3" th:text="${order.buyerNote}"><small>petite note au vendeur</small></div>
				<div class="col-md-2 text-right" th:text="${order.formattedTotal}">18.00$</div>
			</div>
			<div class="row">
				<div class="col-md-2" th:text="|#{sales.orders.detail}:|">detail commande:</div>
				<div class="col-md-10" th:text="${order.detail}">1 Poivre blanc; 1 Poivre noir; 2 Ail en poudre; 1 Aneth en herbe; 1 Anis etoile</div>
			</div>
			<hr/>
		</th:block>
		
	</th:block>
	</body>
</html>
