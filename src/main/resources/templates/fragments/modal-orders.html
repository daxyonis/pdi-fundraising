<!DOCTYPE html >
<html xmlns:th="http://www.thymeleaf.org" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
	  xsi:schemaLocation="http://www.thymeleaf.org ">
<head>
</head>
<body>
<th:block th:fragment="modal">

	<!-- /* Confirm Order Confirmation Modal */ -->
	<div class="modal fade" id="confirmOrder" data-backdrop="static" data-keyboard="false" tabindex="-1"
		 aria-labelledby="confirmOrderLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="confirmOrderLabel" th:text="#{admin.orders.confirm.title}">Modal
						title</h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body text-center">
					<h3><i class="text-success fas fa-check-circle"></i></h3>
					<h5 th:text="#{admin.orders.confirm.warning}">
						La commande sera confirmée. Êtes-vous certain de vouloir confirmer ?
					</h5>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{admin.action.no}">
						Non
					</button>
					<button type="button" id="confirmOrderConfirmed" class="btn btn-success" th:text="#{admin.action.yes}">Oui</button>
				</div>
			</div>
		</div>
	</div>

	<!-- /* Cancel Order Confirmation Modal */ -->
	<div class="modal fade" id="cancelOrder" data-backdrop="static" data-keyboard="false" tabindex="-1"
		 aria-labelledby="cancelOrderLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="cancelOrderLabel" th:text="#{admin.orders.cancel.title}">Modal
						title</h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body text-center">
					<h3><i class="text-primary fas fa-times-circle"></i></h3>
					<h5 th:text="#{admin.orders.cancel.warning}">
						La commande sera annuler. Procéder ?
					</h5>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{admin.action.no}">
						non
					</button>
					<button type="button" id="cancelOrderConfirmed" class="btn btn-primary" th:text="#{admin.action.yes}">oui</button>
				</div>
			</div>
		</div>
	</div>

</th:block>
</body>
</html>
