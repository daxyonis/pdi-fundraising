<!DOCTYPE html >
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	</head>
	<body>
		<div th:fragment="orders">
			<!--/* Messages */-->
			<div class="row mt-3">
				<div class="col-md-12">
					<div class="alert alert-info d-none" id="orders-msg-success">La commande a été confirmée reussi</div>
					<div class="alert alert-warning d-none" id="orders-msg-error">La commande n'a pu être confirmée</div>
				</div>
			</div>
			<!-- /* Title */ -->
			<div class="row mt-3">
				<div class="col-md-12">
					<h4 th:text="#{admin.orders.subtitle}">commandes</h4>
				</div>
			</div>
			<div class="row" id="filters">
				<div class="col-md-3 p-4">
					<button type='button'
							disabled
							class='btn btn-success btn-lg batch-action-confirm'
							onclick='confirmSelectedOrders()'>
							<i class="bi bi-envelope-check"></i>
					</button>
					&nbsp;
					&nbsp;
					<button type='button'
							disabled
							class='btn btn-danger btn-lg batch-action-cancel'
							onclick='cancelSelectedOrders()'>
							<i class="bi bi-envelope-exclamation"></i>
					</button>
				</div>
				<div class="col-md-3">
					<label for="dateRange" th:text="#{admin.orders.daterange}">Date de création</label>
					<div class="input-group input-daterange" id="dateRange">
						<input type="text" class="form-control" name="orderStartDate" id="orderStartDate">
						<div class="input-group-addon" th:text="|&nbsp;#{admin.orders.daterange.to}&nbsp;|">to</div>
						<input type="text" class="form-control" name="orderEndDate" id="orderEndDate">
					</div>
				</div>
				<div class="col-md-2">
					<label for="orderStatus" th:text="#{admin.orders.status}">Statut</label>
					<select class="form-control" id="orderStatus" >
						<option value="" th:text="#{admin.orders.status.ALL}">Tous</option>
						<option value="PENDING" th:text="#{admin.orders.status.PENDING}">En attente</option>
						<option value="PAID" th:text="#{admin.orders.status.PAID}">Payé</option>
						<option value="CANCELLED" th:text="#{admin.orders.status.CANCELLED}">Annulé</option>
					</select>
				</div>
				<div class="col-md-1 pt-4">
					<button type="button" class="btn btn-secondary" id="filterOrders" th:text="#{admin.orders.filter}">Filtrer</button>
				</div>
				<div class="col-md-2 pt-4">
					<button type="button" class="btn btn-primary" id="exportOrders" onclick="exportFilteredOrders()">
						<i class="bi bi-download"></i> <span th:text="#{admin.orders.export}">Exporter</span>
					</button>
				</div>
			</div>
			<div class="row mb-4">
				<div class="col-lg-12">
					<!-- /* Use Datatables for Ajax display */ -->
					<table style="width: 100%; font-size:10pt" id="ordersTable" class="table table-bordered table-striped">
						<thead class="thead-light">
							<tr>
								<th>
									<input aria-label="Select all rows" class="dt-select-checkbox" type="checkbox" id="checkAll">
								</th>
								<th th:text="#{order.number}">no commande</th>
								<th th:text="#{order.date}">date création</th>
								<th th:text="#{order.buyer.name}">nom</th>
								<th th:text="#{order.buyer.email}">email</th>
								<th th:text="#{order.buyer.phone}">tel</th>
								<th th:text="#{order.seller}">vendeur (son nom)</th>
								<th th:text="#{order.campaign.number}">no campagne</th>
								<th th:text="#{order.organization}">nom organisation</th>
								<th th:text="#{order.status}">statut</th>
								<th th:text="#{admin.orders.confirm}">Confirmer</th>
								<th th:text="#{admin.orders.cancel}">Annuler</th>
							</tr>
						</thead>
					</table>
				</div>
			</div>
			
			<script th:inline="javascript">

				/* Define methods and constants */
				const batchUrl = /*[[@{/api/admin/orders/batch}]]*/'/api/admin/orders/batch';
				let ordersTable;

				function uncheckAll() {
					ordersTable.rows().deselect();
					$('#checkAll').prop('checked', false);
				}

				function confirmSelectedOrders() {
					$('#reconfirmOrdersModal').modal('show');
					$('#reconfirmOrders').off();
					$('#reconfirmOrders').on('click', function() {
						$('#reconfirmOrdersModal').modal('hide');
						const data = ordersTable.rows({selected: true}).data().toArray()
								.filter(r => r.orderStatus === 'PAID')
								.map(r => r.id);
						$.post({
							url: batchUrl + '?action=resend_confirm',
							data: JSON.stringify(data),
							contentType: 'application/json',
							success: function (data) {
								const msg = /*[[#{admin.orders.resendConfirm.success}]]*/'succes!';
								const results = `. Nb sent messages/ Nb messages envoyés : ${data}`;
								displaySuccess('#orders-msg-success', msg + results);
							},
							error: function (err) {
								console.log(err.responseJSON);
								displayError(err, '#orders-msg-error', /*[[#{admin.orders.resendConfirm.error}]]*/'Erreur');
							}
						}).done(function(){
							uncheckAll();
						});
					});
				}

				function cancelSelectedOrders() {
					$('#recancelOrdersModal').modal('show');
					$('#recancelOrders').off();
					$('#recancelOrders').on('click', function() {
						$('#recancelOrdersModal').modal('hide');
						const data = ordersTable.rows({selected: true}).data().toArray()
								.filter(r => r.orderStatus === 'CANCELLED')
								.map(r => r.id);
						$.post({
							url: batchUrl + '?action=resend_cancel',
							data: JSON.stringify(data),
							contentType: 'application/json',
							success: function (data) {
								const msg = /*[[#{admin.orders.resendCancel.success}]]*/'succes!';
								const results = `. Nb sent messages/ Nb messages envoyés : ${data}`;
								displaySuccess('#orders-msg-success', msg + results);
							},
							error: function (err) {
								console.log(err.responseJSON);
								displayError(err, '#orders-msg-error', /*[[#{admin.orders.resendCancel.error}]]*/'Erreur');
							}
						}).done(function(){
							uncheckAll();
						});
					});
				}
				const confirmUrl = /*[[@{/api/admin/orders/confirm}]]*/'/api/admin/orders/confirm';
				function confirmOrder(orderNumber) {
					$('#confirmOrder').modal('show');
					$('#confirmOrderConfirmed').off();
					$('#confirmOrderConfirmed').on('click', function(){
						$('#confirmOrder').modal('hide');
						console.log('confirmOrder #' + orderNumber);
						$.ajax({
							url: `${confirmUrl}?orderNumber=${orderNumber}`,
							type: 'PUT',
							success: function(data) {
								displaySuccess('#orders-msg-success', /*[[#{admin.orders.success}]]*/'succes!');
								reloadAllPendingOrders();
							},
							error: ordersFailureHandler
						});
					});
				}

				const cancelUrl = /*[[@{/api/admin/orders/cancel}]]*/'/api/admin/orders/cancel';
				function cancelOrder(orderNumber) {
					$('#cancelOrder').modal('show');
					$('#cancelOrderConfirmed').off();
					$('#cancelOrderConfirmed').on('click', function(){
						$('#cancelOrder').modal('hide');
						console.log('cancelOrder #' + orderNumber);
						$.ajax({
							url: `${cancelUrl}?orderNumber=${orderNumber}`,
							type: 'PUT',
							success: function(data) {
								displaySuccess('#orders-msg-success', /*[[#{admin.orders.cancel.success}]]*/'succes!');
								reloadAllPendingOrders();
							},
							error: ordersFailureHandler
						});
					});
				}

				function ordersFailureHandler (err){
					console.log(err.responseJSON);
					if(err.responseJSON && err.responseJSON.message){
						displayError(err, '#orders-msg-error', `ERREUR : ${err.responseJSON.message}`);
					} else {
						displayError(err, '#orders-msg-error', /*[[#{admin.action.error}]]*/'Erreur');
					}
				}

				function reloadAllPendingOrders(){
					ordersTable.ajax.reload();
				}

				function exportFilteredOrders() {
				// Get current sort order from DataTable
				const tableOrder = ordersTable.order();
				const order = tableOrder.map(o => ({
					column: o[0],
					dir: o[1],
					name: ordersTable.settings()[0].aoColumns[o[0]].data || ''
				}));

				const data = {
					startDate: $('#orderStartDate').val() || null,
					endDate: $('#orderEndDate').val() || null,
					status: $('#orderStatus').val() || null,
					search: { value: ordersTable.search() || '' },
					order: order
				};

				$.ajax({
					url: /*[[@{/api/admin/orders/download}]]*/'/api/admin/orders/download',
					method: 'POST',
					contentType: 'application/json',
					data: JSON.stringify(data),
					xhrFields: { responseType: 'blob' },
					success: function(blob) {
						const url = window.URL.createObjectURL(blob);
						const a = document.createElement('a');
						a.href = url;
						a.download = 'orders-export.csv';
						a.click();
						window.URL.revokeObjectURL(url);
					},
					error: function(err) {
						displayError(err, '#orders-msg-error', /*[[#{admin.orders.export.error}]]*/'Export error');
					}
				});
			}

			const confirmButtonLabel = /*[[#{admin.orders.confirm}]]*/'confirmer';
				const cancelButtonLabel = /*[[#{admin.orders.cancel}]]*/'annuler';

				const ordersDatatablesOptions = {
									paging: true,
									sorting: true,
									serverSide: true,
									processing: true,
									searching : true,
									ordering: true,
									responsive: true,
									lengthMenu: [ [10, 25, 50, 100, -1], [10, 25, 50, 100, "All"] ],
									pageLength: 10,
									info: true,
									language: {
										url: /*[[@{/json/datatables_1.10.22_i18n_french.json}]]*/'json/datatables_1.10.22_i18n_french.json'
									},
									select: {
										style: 'multi',
										selector: 'td:first-child',
										headerCheckbox: true,
									}
							};

				$(function() {

					// Init datepicker
					$('.input-daterange input').each(function() {
						$(this).datepicker({
							format: /*[[${dateFormat}]]*/'dd/mm/yyyy',
							language:/*[[${language}]]*/'fr',
						});
					});


					ordersTable = $('#ordersTable')
							//.on('draw.dt', initOrdersButtonHandlers)
							.DataTable(
									Object.assign({
										ajax: {
											url: /*[[@{/api/admin/orders}]]*/'/api/admin/orders',
											method: 'POST',
											contentType: 'application/json',
											dataType : 'json',
											data: function(d) {
												d.startDate = $('#orderStartDate').val();
												d.endDate = $('#orderEndDate').val();
												d.status = $('#orderStatus').val();
												return JSON.stringify(d);
											}
										},
										columns: [
											{data: null, render: DataTable.render.select(), sortable: false},
											{data: 'orderNumber'},
											{data: 'formattedCreatedDate', sortable: false},
											{data: 'buyerName', sortable: false},
											{data: 'buyerEmail', sortable: false},
											{data: 'buyerPhone', sortable: false},
											{data: 'sellerName', sortable: false},
											{data: 'campaignNumber', sortable: false},
											{data: 'organizationName', sortable: false},
											{
												data: 'orderStatus', render: function (data, type, row) {
													return `<span class='badge badge-pill badge-${row.orderStatus}'>${row.orderStatus}</span>`;
												}
											},
											{
												data: 'id',
												orderable: false,
												width: "100px",
												render: function (data, type, row) {
													if (row.orderStatus === 'PENDING' || row.orderStatus == 'CANCELLED') {
														return `<button type='button'
						    						class='btn btn-success btn-sm action-confirm'
						    						onclick='confirmOrder(${row.orderNumber})'
						    				><i class='fa fa-check-circle'></i></button>`;
													} else {
														return '';
													}
												}
											},
											{
												data: 'id',
												orderable: false,
												width: "100px",
												render: function (data, type, row) {
													if (row.orderStatus === 'PENDING' || row.orderStatus == 'PAID') {
														return `<button type='button'
															class='btn btn-danger btn-sm action-cancel'
															onclick='cancelOrder(${row.orderNumber})'
													><i class='fa fa-times-circle'></i></button>`;
													} else {
														return '';
													}
												}
											}
										]
									}, ordersDatatablesOptions));

					ordersTable.on('select', function(e, dt, type, indexes){
									$('.batch-action-confirm').attr('disabled', false);
									$('.batch-action-cancel').attr('disabled', false);
								})
								.on('deselect', function(e, dt, type, indexes){
									if(ordersTable.rows({selected: true}).count() === 0){
										$('.batch-action-confirm').attr('disabled', true);
										$('.batch-action-cancel').attr('disabled', true);
									}});

					$('#filterOrders').on('click', function(){
						ordersTable.ajax.reload();
					});

					$('#checkAll').on('click', function(){
						let isChecked = $(this).prop('checked');
						if (isChecked) {
							ordersTable.rows().select();
						} else {
							ordersTable.rows().deselect();
						}
					});
				});
			</script>
			
		</div>
	</body>
</html>
