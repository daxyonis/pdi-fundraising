<!DOCTYPE html >
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	</head>
	<body>
		<div th:fragment="import">
			<!--/* Messages */-->
			<div class="row mt-3">
				<div class="col-md-12">
					<div id = "toast-import-msg-success" class="toast d-none" role="alert" aria-live="assertive" aria-atomic="true">
						<div class="toast-header bg-info text-white">
							<strong class="mr-auto">Bootstrap</strong>
							<small>11 mins ago</small>
							<button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
								<span aria-hidden="true">&times;</span>
							</button>
						</div>
						<div id="import-msg-success" class="toast-body bg-light text-dark">
							L'importation des nouveaux groupes a reussi
						</div>
					</div>
					<div id="toast-import-msg-error" class="toast d-none" role="alert" aria-live="assertive" aria-atomic="true">
						<div class="toast-header bg-warning text-white">
							<strong class="mr-auto">Bootstrap</strong>
							<small>11 mins ago</small>
							<button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
								<span aria-hidden="true">&times;</span>
							</button>
						</div>
						<div id="import-msg-error" class="toast-body bg-light text-dark">
							L'importation des nouveaux groupes a echoue
						</div>
					</div>
				</div>
			</div>
			<div th:replace="fragments/spinner :: spinner"></div>
			<!-- /* Sections and products import */ -->
			<div class="row mt-3">
				<div class="col-md-12">
					<h4 th:text="#{admin.import.folder}">Importer tout</h4>
				</div>
			</div>
			<div class="row">
				<div class="col-md-4 pt-2">					
					<span th:text="#{admin.import.last}">Dernier import le</span><span id="prodLastImport" th:text="${sectionsAndProductsLastImport}">2021/12/12</span>									
				</div>				
				
				<div class="col-md-5">																								
						<div class="fileBtn btn btn-outline-success px-lg-3">
							<label for="inputFolder" th:text="#{admin.import.select}">S�lectionnez le r�pertoire des fichiers</label>
							<input id="inputFolder" class="upload d-none" type="file" accept=".csv" webkitdirectory multiple />
						</div>					  							
				</div>
			</div>			
			<div class="row">
				<div class="col-md-8 offset-md-4">
					<p class="text-primary" th:if="${showWarning}" th:text="#{admin.import.warning}">Attention: campagne(s) en cours...</p>					
				</div>							
			</div>	
			<!-- /* Image of all Products import */ -->
			<div class="row mt-4">
				<div class="col-md-12">
					<h4 th:text="#{admin.import.productsImage}">photo produits</h4>
				</div>
			</div>		
			<div class="row">
				<div class="col-md-4 pt-2">
				</div>
				<div class="col-md-4">
					<img id="image_fr" th:src="|@{/api/file/}?description=products_fr|" class="img-products" />
					<div class="imgFileBtn btn btn-outline-success px-lg-3">
						<label for="productsImageFr" th:text="#{admin.import.select.products.fr}">Selectionnez image produits</label>
						<input id="productsImageFr" data-lang="fr" class="upload-products d-none" type="file" accept="image/*" />
					</div>
				</div>
				<div class="col-md-4">
					<img id="image_en" th:src="|@{/api/file/}?description=products_en|" class="img-products" />
					<div class="imgFileBtn btn btn-outline-success px-lg-3">
						<label for="productsImageEn" th:text="#{admin.import.select.products.en}">Selectionnez image produits</label>
						<input id="productsImageEn" data-lang="en" class="upload-products d-none" type="file" accept="image/*" />
					</div>
				</div>
			</div>						
			
			<script th:inline="javascript">

			function showToastMessage(msgId, msg){
				$('#'+msgId).text(msg);
				$('#toast-'+msgId).removeClass('d-none');
				$('#toast-'+msgId).toast('show');
			}

			$(function(){		   	    	
				const FILETYPES = ["SECTION","PRODUIT","TYPEBC","CAMPAGNE","GROUPE","VENDEUR","LIENGROUPE"];					
				
				// Error in the selector: fileBtn is a CSS class, so this event never gets called !!!
				$('fileBtn').on('click', function(){
					$(this).children('input.upload').trigger('change');
				});
				
				// Error in the selector: imgfileBtn is a CSS class, so this event never gets called !!!
				$('imgFileBtn').on('click', function(){
					$(this).children('input.upload-products').trigger('change');
				});
				
				$('.upload').on('change', function(){		
					$('#spinning').removeClass('d-none');
					let files = this.files;
					
					let allFiles = {};
					for(let i=0; i<files.length; i++){						
						let file = files[i];
						// Validate its a CSV
						if(file.name.match(/.csv/)){								
							// Validate its name starts with the file type	
							let fileType = file.name.toUpperCase().match(/SECTION|PRODUIT|TYPEBC|CAMPAGNE|GROUPE|VENDEUR|LIENGROUPE/);
							if(fileType && fileType.index >= 0){
								allFiles[fileType[0]] = file;
							} else {
								console.log("File type not found in file name : " + file.name);
							}							
						} else {
							console.log("Discarding file" + file.name + " because not of expected type.");
						}
					}
					uploadAllInOrder(allFiles);
					
				});
								
				
				async function uploadAllInOrder(allFiles){					
					if(allFiles){
						let messages = [];
						// Upload them in order
						for(let i=0; i< FILETYPES.length; i++){
							if(allFiles[FILETYPES[i]]){
								try{
									messages[i] = await uploadFile(FILETYPES[i], allFiles[FILETYPES[i]]);	
								}								
								catch(err){
									$('#spinning').addClass('d-none');
									console.log(err.responseJSON);
									if(err.responseJSON && err.responseJSON.message){
										showToastMessage('import-msg-error', `ERREUR : ${err.responseJSON.message}`);
									} else {
										showToastMessage('import-msg-error', /*[[#{admin.import.error}]]*/ 'Erreur');
									}
								}
							}	
						}		
						$('#spinning').addClass('d-none');
						showToastMessage('import-msg-success', messages.map((m)=>m.message).join("  "));
					}					
				}
				
				function uploadFile(fileType, file){
					// Ajax call to upload this file
					let fd = new FormData();
					fd.append('file', file);					
					let url = /*[[@{/api/file/data/upload}]]*/ '';
					console.log(`Uploading file ${fileType}`);
					return $.post({
						url: `${url}?fileType=${fileType}`,
						data: fd,
						contentType: false,						
						processData: false,
						success: function(result) {
							//$('#spinning').addClass('d-none');
							//showToastMessage('import-msg-success', result.message);
							const selector = 'span#prodLastImport';									
							$(selector).text(result.lastImportDate);
						}
					});										
				}
				
				
				$('.upload-products').on('change', function(){		
					$('#spinning').removeClass('d-none');
					let file = this.files[0];
					let fd = new FormData();
					fd.append('file', file);					
					let url = /*[[@{/api/file/upload}]]*/ '';
					let lang = $(this).data('lang');
					console.log(`Uploading file...`);
					return $.post({
						url: `${url}?description=products_${lang}`,
						data: fd,
						contentType: false,						
						processData: false,
						success: function(result) {
							$('#spinning').addClass('d-none');
							showToastMessage('import-msg-success', result.message);
							// Refresh image
							$(`#image_${lang}`).attr('src', $(`#image_${lang}`).attr('src') + '&t=' + new Date().getTime());
						}
					})
					.fail(function(err){
						$('#spinning').addClass('d-none');
						console.log(err.responseJSON);
						if(err.responseJSON && err.responseJSON.message){
							showToastMessage('import-msg-error', `ERREUR : ${err.responseJSON.message}`);
						} else {
							showToastMessage('import-msg-error', /*[[#{admin.import.error}]]*/'Erreur');
						}
					});;
				});
			});
			</script>
			
		</div>		
	</body>
</html>
