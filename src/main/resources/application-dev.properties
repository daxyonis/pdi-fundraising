spring.config.import=optional:configtree:/run/secrets/

# DEV application server
server.port=8081

# Default application database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
#spring.jpa.database-platform=org.hibernate.dialect.MariaDB103Dialect

# JPA
spring.jpa.hibernate.ddl-auto=update

# Logger
logging.level.com.poivredesiles.fundraising=INFO
logging.level.com.poivredesiles.fundraising.service=DEBUG
# logging.level.com.filemaker.jdbc=DEBUG
# logging.level.org.springframework.security=DEBUG

# Log path in container
logging.file.path=/var/log

# Mail with https enabled
spring.mail.host=box242.rapidenet.ca
spring.mail.port=587
spring.mail.username=webmestre@poivredesiles.com
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
management.endpoints.web.exposure.include=*

