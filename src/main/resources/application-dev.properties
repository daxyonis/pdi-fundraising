# Default application database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.jpa.database-platform=org.hibernate.dialect.MariaDB103Dialect

# JPA
spring.jpa.hibernate.ddl-auto=update

# Logger
logging.level.com.poivredesiles.fundraising=DEBUG
# logging.level.com.filemaker.jdbc=DEBUG
# logging.level.org.springframework.security=DEBUG

logging.file.name = pdi.log

# Mail : when https is not enabled
spring.mail.host=mail.poivredesiles.com
spring.mail.port=587
spring.mail.username=webmestre@poivredesiles.com 
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Actuator
management.endpoints.web.exposure.include=*

# Spring Boot Admin
spring.boot.admin.client.url=http://localhost:8081
spring.boot.admin.client.instance.management-base-url=http://localhost:8080
spring.boot.admin.client.instance.service-base-url=http://localhost:8080

# Task Executor
spring.task.execution.thread-name-prefix=pdi-task-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=10000
spring.task.scheduling.thread-name-prefix=pdi-task-scheduling-
spring.task.scheduling.pool.size=2

