menu.faq=FAQ
pdi.faq=Frequently Asked Questions 
faq.q1=Can I order after the "Expected campaign end date"?
faq.a1=This date is an indication of the end of the fundraising campaign. Only the person responsible for the campaign can end the campaign, which deactivates all access codes. From that moment, you can no longer order and the forms are sent to Poivre des Îles for assembly. 
faq.q2=When will I receive my products?
faq.a2=Approximately 1 month after the date the campaign was ended by the responsible person.
faq.q3=Can I have my products delivered to my home?
faq.a3=Unfortunately, this is not possible. The products are all delivered to the organization in order to avoid charging you delivery costs and to be more ecological by making one shipment rather than several small shipments. Your details are only used for payment.
faq.q4=Can I make more than one order?
faq.a4=Yes, each order is assembled separately and then grouped by vendors.
faq.q5=What is the note box for?
faq.a5=You can add a note to the seller.
